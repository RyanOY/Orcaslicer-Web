<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voron · 预览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23242424'/%3E%3Cpath d='M8 22h16M8 16h16M8 10h16' stroke='%23ff7d38' stroke-width='3'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #242424;
    --panel: rgba(28, 28, 28, .92);
    --line: #3a3a3a;
    --text: #e6e6e6;
    --dim: #9a9a9a;
    --accent: #23a9f2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); -webkit-user-select: none; user-select: none;
    font: 12px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Noto Sans CJK SC", "Segoe UI", sans-serif;
    touch-action: none;
  }
  canvas#gl { display: block; width: 100%; height: 100%; }

  /* ---------- 顶栏 ---------- */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 44px;
    display: flex; align-items: center; gap: 6px; padding: 0 10px;
    background: linear-gradient(rgba(20,20,20,.96), rgba(20,20,20,.72) 70%, transparent);
    z-index: 10;
  }
  #title { font-size: 12px; color: var(--dim); margin-right: auto;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09);
    color: #d8d8d8; border-radius: 6px; padding: 5px 9px; font: inherit;
    cursor: pointer; white-space: nowrap; transition: background .12s;
  }
  .btn:active { background: rgba(255,255,255,.14); }
  .btn.on { background: rgba(35,169,242,.20); border-color: rgba(35,169,242,.55);
    color: #bfe6ff; }
  .sep { width: 1px; height: 18px; background: rgba(255,255,255,.10); }
  /* 明暗三档滑杆 */
  #shade {
    -webkit-appearance: none; appearance: none; width: 68px; height: 18px;
    background: transparent; margin: 0; cursor: pointer;
  }
  #shade::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(35,169,242,.75), rgba(35,169,242,.25));
  }
  #shade::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px;
    border-radius: 50%; background: #bfe6ff; border: 1px solid rgba(35,169,242,.8);
  }
  #shade::-moz-range-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(35,169,242,.75), rgba(35,169,242,.25));
  }
  #shade::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%; background: #bfe6ff;
    border: 1px solid rgba(35,169,242,.8);
  }
  #shadetag { font-size: 10.5px; color: var(--dim); min-width: 38px; }
  @media (max-width: 460px) { #shade { width: 52px; } #shadetag { display: none; } }

  /* ---------- 右侧层滑块 ---------- */
  #layercol {
    position: fixed; top: 48px; bottom: 74px; right: 0; width: 46px;
    z-index: 9; display: flex; flex-direction: column; align-items: center;
    touch-action: none;
  }
  #layercol canvas { width: 30px; flex: 1; border-radius: 4px;
    background: rgba(255,255,255,.045); cursor: ns-resize; }
  #layerz { font-size: 10px; color: var(--dim); padding: 3px 0; font-variant-numeric: tabular-nums; }

  /* ---------- 图例 ---------- */
  #legend {
    position: fixed; left: 10px; bottom: 46px; z-index: 9; min-width: 208px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 9px 6px; backdrop-filter: blur(8px); font-size: 11px;
  }
  #legend .lg-head { display: flex; align-items: center; gap: 6px;
    color: var(--dim); margin-bottom: 5px; cursor: pointer; font-size: 10.5px;
    letter-spacing: .04em; }
  #legend .lg-head b { color: var(--text); font-weight: 500; letter-spacing: 0; }
  #legend table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  #legend td { padding: 1.5px 0; white-space: nowrap; }
  #legend td.n { text-align: right; color: var(--dim); padding-left: 10px; }
  #legend tr.row { cursor: pointer; }
  #legend tr.row.off { opacity: .32; }
  #legend tr.row.off .sw span { opacity: .3; }
  #legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
    margin-right: 6px; vertical-align: -1px; }
  #legend.collapsed table { display: none; }
  /* 着色依据选择器 */
  #scheme {
    background: rgba(255,255,255,.08); color: #e8e8e8;
    border: 1px solid rgba(255,255,255,.14); border-radius: 5px;
    font: inherit; font-size: 11px; padding: 2px 4px; max-width: 132px;
    -webkit-appearance: none; appearance: none;
  }
  #scheme:focus { outline: 1px solid rgba(35,169,242,.6); }
  /* 连续量的渐变色带（竖条，跟 OrcaSlicer 的图例一样） */
  #lgbar { display: none; gap: 8px; align-items: stretch; padding: 2px 0 1px; }
  #lgbar.on { display: flex; }
  #lgbar .ramp { width: 14px; height: 86px; border-radius: 3px;
    border: 1px solid rgba(255,255,255,.12); }
  #lgbar .ticks { display: flex; flex-direction: column; justify-content: space-between;
    height: 86px; font-size: 10px; color: var(--dim);
    font-variant-numeric: tabular-nums; line-height: 1.1; }
  #lgbar .ticks em { color: var(--text); font-style: normal; }
  #lgbar .note { font-size: 10px; color: var(--dim); line-height: 1.5; max-width: 132px; }
  #lgnote { font-size: 9.5px; color: var(--dim); line-height: 1.45; margin-top: 4px;
    max-width: 210px; }

  /* ---------- 底栏 ---------- */
  #bottombar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 38px; z-index: 9;
    display: flex; align-items: center; gap: 14px; padding: 0 12px;
    background: linear-gradient(transparent, rgba(20,20,20,.94) 40%);
    font-variant-numeric: tabular-nums; color: #cfcfcf; font-size: 11.5px;
    overflow: hidden; white-space: nowrap;
  }
  #bottombar b { color: #fff; font-weight: 600; }
  #bottombar .k { color: var(--dim); }

  #hint {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    text-align: center; color: var(--dim); font-size: 12px; line-height: 1.8;
    z-index: 20; pointer-events: none;
  }
  #hint input { pointer-events: auto; }
  #toast {
    position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%);
    background: rgba(200,60,60,.92); color: #fff; padding: 7px 12px;
    border-radius: 7px; font-size: 12px; opacity: 0; transition: opacity .25s;
    z-index: 30; pointer-events: none; max-width: 80%;
  }
  #toast.show { opacity: 1; }
  @media (max-width: 460px) {
    #legend { min-width: 176px; font-size: 10.5px; }
    #bottombar { gap: 10px; font-size: 10.5px; }
    #title { display: none; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="topbar">
  <span id="title">—</span>
  <button class="btn on" data-mode="single">单层</button>
  <button class="btn" data-mode="accum">累积</button>
  <button class="btn" data-mode="all">全部</button>
  <span class="sep"></span>
  <button class="btn" id="play">▶</button>
  <span class="sep"></span>
  <button class="btn" data-view="iso">等轴</button>
  <button class="btn" data-view="top">俯视</button>
  <button class="btn" data-view="front">正视</button>
  <span class="sep"></span>
  <button class="btn on" id="btn3d" title="体积管 / 屏幕线">体积</button>
  <span class="sep"></span>
  <input id="shade" type="range" min="0" max="2" step="1" value="1"
         title="明暗强度：平涂 / 标准 / 强明暗">
  <span id="shadetag">标准</span>
</div>

<div id="layercol">
  <canvas id="layerslider"></canvas>
  <div id="layerz">—</div>
</div>

<div id="legend">
  <div class="lg-head" id="lghead">
    <select id="scheme" title="着色依据"></select>
    <span id="lgsum" style="margin-left:auto"></span></div>
  <table id="lgtbl"></table>
  <div id="lgbar"></div>
  <div id="lgnote"></div>
</div>

<div id="bottombar">
  <span><span class="k">层</span> <b id="bLayer">—</b></span>
  <span><span class="k">Z</span> <b id="bZ">—</b></span>
  <span><span class="k">本层</span> <b id="bLT">—</b></span>
  <span><span class="k">总用时</span> <b id="bT">—</b></span>
  <span><span class="k">耗材</span> <b id="bF">—</b></span>
</div>

<div id="hint">等待任务…</div>
<div id="toast"></div>

<script>
"use strict";

/* ========================================================================
   配色：直接取自 OrcaSlicer（libvgcode DEFAULT_EXTRUSION_ROLES_COLORS）
   ======================================================================== */
const ROLE_COLORS = [
  [255, 125, 56],   // 0  外墙     ExternalPerimeter
  [255, 230, 77],   // 1  内墙     Perimeter
  [255, 170, 90],   // 2  悬垂墙   OverhangWall
  [176, 48, 41],    // 3  稀疏填充 InternalInfill
  [150, 84, 204],   // 4  实心填充 SolidInfill
  [240, 64, 64],    // 5  顶面     TopSolidInfill
  [205, 120, 140],  // 6  底面     BottomSurface
  [77, 128, 186],   // 7  桥接     BridgeInfill
  [90, 170, 200],   // 8  内部桥接 InternalBridge
  [0, 255, 0],      // 9  支撑     SupportMaterial
  [0, 170, 90],     // 10 支撑界面 SupportInterface
  [160, 160, 170],  // 11 缝隙填充 GapFill
  [120, 200, 255],  // 12 裙边     Skirt/Brim
  [200, 200, 200],  // 13 自定义   Custom
  [230, 179, 179],  // 14 其他
];
const C_GRID = [58, 58, 58];
const C_BORDER = [96, 96, 96];
const C_AXIS_X = [176, 74, 74];
const C_AXIS_Y = [92, 152, 92];
const PALETTE = [...ROLE_COLORS, C_GRID, C_BORDER, C_AXIS_X, C_AXIS_Y];
const T_GRID = 15, T_BORDER = 16, T_AXX = 17, T_AXY = 18;

/* 属性着色：分类（≤6 个取值）用离散色，连续值用光谱渐变 */
const CAT_COLORS = [
  [77, 128, 186], [255, 176, 56], [91, 200, 91], [220, 92, 140],
  [150, 84, 204], [72, 201, 201], [230, 222, 90], [192, 192, 192],
];
const RAMP_STOPS = [
  [49, 54, 149], [69, 117, 180], [116, 173, 209], [171, 217, 233],
  [224, 243, 248], [255, 255, 191], [254, 224, 144], [253, 174, 97],
  [244, 109, 67], [215, 48, 39], [165, 0, 38],
];
function rampColor(t) {
  t = Math.max(0, Math.min(1, t)) * (RAMP_STOPS.length - 1);
  const i = Math.min(RAMP_STOPS.length - 2, Math.floor(t));
  const f = t - i, a = RAMP_STOPS[i], b = RAMP_STOPS[i + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
function rgbCss(c) { return `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`; }
/* 全模型只有一个取值时用的中性色（别和分类色撞车，否则会被误读成某一档） */
const FLAT_COLOR = [146, 164, 194];

/* 着色依据：k = index["attrs"] 里的列号 */
const SCHEMES = [
  { id: "type", label: "走线类型", kind: "type", note: "按 ;TYPE: 角色，点击图例可隐藏" },
  { id: "tool", label: "挤出机", k: 0, unit: "", fmt: v => "T" + v,
    note: "T0/T1 与 M104 T" },
  { id: "speed", label: "速度", k: 1, unit: "mm/s", fmt: v => v.toFixed(0),
    note: "逐段 G1 F ÷ 60：指令上限。机器实际跑多快看「实际速度」" },
  { id: "fan", label: "风扇", k: 2, unit: "%", fmt: v => v.toFixed(0),
    note: "M106 S ÷ 255" },
  { id: "temp", label: "喷嘴温度", k: 3, unit: "°C", fmt: v => v.toFixed(0),
    note: "M104/M109，缺省取耗材温度" },
  { id: "accel", label: "加速度", k: 4, unit: "mm/s²", fmt: v => v.toFixed(0),
    note: "M204 S / SET_VELOCITY_LIMIT ACCEL" },
  { id: "jerk", label: "抖动", k: 5, unit: "mm/s", fmt: v => v.toFixed(1),
    note: "M205 J / SQUARE_CORNER_VELOCITY" },
  { id: "vact", label: "实际速度", kind: "vact", unit: "mm/s", fmt: v => v.toFixed(0),
    note: "Klipper lookahead 回放：转角/折返降到 square_corner_velocity，长直段才冲到指令速度" },
  { id: "aeff", label: "实际加速度", kind: "aeff", unit: "mm/s²", fmt: v => v.toFixed(0),
    note: "|v₂²−v₁²| ÷ 2L：≈0 是匀速段，接近机器加速度说明这段正在加速/减速" },
];

const cv = document.getElementById("gl");
/* preserveDrawingBuffer 默认关闭（省显存、合成更快）。
   加 ?capture=1 打开它，专门给自动化测试用 —— 否则 headless 下
   readPixels / screenshot / toDataURL 只能读回全黑，无法验证渲染结果
   （踩过：draw call 明明发生了 482 次，读回来还是黑的）。 */
const CAPTURE = /(?:^|[?&])capture=1(?:&|$)/.test(location.search);
const gl = cv.getContext("webgl2", { antialias: true, alpha: false,
  depth: true, powerPreference: "high-performance",
  preserveDrawingBuffer: CAPTURE });
const hintEl = document.getElementById("hint");

/* ---------------------------------------------------------------- 矩阵 */
const M4 = {
  perspective(fovy, asp, n, f) {
    const t = 1 / Math.tan(fovy / 2), d = 1 / (n - f);
    return new Float32Array([t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) * d, -1, 0, 0, 2 * f * n * d, 0]);
  },
  mul(a, b) {
    const o = new Float32Array(16);
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k];
      o[i * 4 + j] = s;
    }
    return o;
  },
  lookAt(eye, at, up) {
    let zx = eye[0] - at[0], zy = eye[1] - at[1], zz = eye[2] - at[2];
    let l = Math.hypot(zx, zy, zz) || 1; zx /= l; zy /= l; zz /= l;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    return new Float32Array([
      xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
      -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
      -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
      -(zx * eye[0] + zy * eye[1] + zz * eye[2]), 1]);
  }
};
/* ---------------------------------------------------------------- 着色器 */
/* 参考 OrcaSlicer 的 GCodeViewer 思路（src/slic3r/GUI/GCodeViewer.cpp）：
   1) 走线几何一次性上传成静态顶点缓冲，每一帧只改「画哪一段」，
      不做逐层 buffer 上传、不逐层重设 uniform —— 这是 Orca 预览流畅的根本；
   2) 每段的颜色（按类型的调色板 / 按速度等属性的渐变）在着色器里取，
      颜色是顶点属性而不是逐个 draw call 的 uniform；
   3) 预览是不透明的：层与层之间用配色区分，不用 alpha 混合。半透明 +
      深度写入会让同一面被叠加多次、绘制顺序一变颜色就变，这正是
      以前「透明度忽深忽浅 / 面闪」的来源；
   4) 层的可见性靠 z 判断（单层 / 累积 / 全部），不再是逐层 draw。

   与 Orca 的差别：本预览每段的数据来自服务端预先算好的定长记录
   （20 字节/段：x0 y0 x1 y1 | type | area | attr），所以整份文件就是
   一条可以直接当实例属性用的流，连 CPU 侧重组都不需要。 */

const FOVY = Math.PI / 5;         // 与 draw() 里的 perspective 保持一致
const BG = [0.141, 0.141, 0.141];
const WIDTH_SCALE = 1.15;         // 线宽 = 截面积/层高 × 该系数（搭接余量，防漏缝）
const LINE_MM = 0.45;             // 没有面积数据时的兜底线宽
/* 最细线宽（CSS 像素，半宽）。0.60 → 整条线 1.2 CSS px。
   以前这里写的是「设备像素」，但在 dpr=2 的手机上 0.6 设备像素半宽
   只有 0.6 CSS px，光栅器经常把远处的线直接漏掉 —— 用户看到的
   「远处走线宽度变 0」就是这个。现在按 CSS 像素给足 1.2 px，
   再乘 dpr 换成设备像素，任何屏幕上都不会细到消失。 */
const MIN_HALF_PX = 0.60;         // CSS 像素半宽 → 整线 1.2 CSS px
const MITER_LIMIT = 3.0;          // 斜接长度上限（单位 = 半线宽），再尖的角就削平
const JOINT_LEN_FRAC = 0.45;      // 角点沿段方向最多伸到段长的这个比例（>0.5 会翻领结）
const MAX_HALF_PX = 400.0;        // 基本不封顶：线宽必须跟着缩放走，放大才不会出现层间缝
const CAPS_MIN_PX = 4.5;          // 宽度够粗才画球冠端帽
/* 体积管的三角形预算按「当前视图真正要画的段数」算，不是整份文件的段数：
   单层/累积模式只看几层，几十万段的任务照样能用管；只有「全部」才是全量。 */
/* 设备能力系数：低端机（内存小 / 高 DPR）自动收紧预算，避免为了画质
   把帧率压垮。navigator.deviceMemory 拿不到时按中端（1.0）算。
   实测缩放过程里 caps 模式最多约 470 万顶点，中高端手机没问题，
   但 2GB 内存的机器需要早点退回 thin。 */
const DEVICE_FACTOR = (() => {
  let f = 1;
  const mem = +(navigator.deviceMemory || 0);
  if (mem && mem <= 2) f = 0.35;
  else if (mem && mem <= 3) f = 0.6;
  const dprNow = Math.min(devicePixelRatio || 1, 2);
  if (dprNow >= 2) f *= 0.8;          // 高 DPR 着色量翻倍
  return Math.max(0.25, Math.min(1, f));
})();
const CAPS_SEG_BUDGET = Math.round(200000 * DEVICE_FACTOR);   // caps 48 三角/段
const TUBE_SEG_BUDGET = Math.round(1600000 * DEVICE_FACTOR);  // thin 16 三角/段
/* 运行时可变预算（掉帧会自动收紧，见 noteFrameCost） */
let capBudget = CAPS_SEG_BUDGET, tubeBudget = TUBE_SEG_BUDGET;

const GLSL_HEAD = `#version 300 es
precision highp float;
precision highp sampler2D;

in vec2 aStart;       // 每段：起点 xy（实例属性）
in vec2 aEnd;         // 每段：终点 xy
in float aZ;          // 每段：所属层的高度 z
in float aType;       // 每段：走线类型 0..14
in float aArea;       // 每段：挤出截面积 / uAreaStep
in float aAttr;       // 每段：attrs 表行号（着色依据用）
in float aVact;       // 每段：Klipper 限速后的真实速度 ×100（mm/s）
in float aAeff;       // 每段：段内有效加速度 mm/s²

uniform mat4 uVP;
uniform vec2 uViewport;     // 半屏像素尺寸，用来把毫米换成像素
uniform float uProj;        // (H/2)/tan(fov/2)
uniform float uLayerH;      // 当前层高，把截面积换算成线宽
uniform float uAreaOn;      // 0 = 没有截面积数据（旧任务/底板）
uniform float uAreaStep;
uniform float uWidthScale;
uniform float uMinHalfPx;
uniform float uMaxHalfPx;
uniform vec3 uColors[20];   // 类型调色板（含底板网格用的几个）
uniform int uColorMode;     // 0 = 按类型, 1 = 属性表, 2 = 真实速度, 3 = 真实加速度
uniform sampler2D uRowColor;
uniform vec2 uVRange;       // 连续量（速度/加速度）的取值范围
uniform int uRowCount;      // uRowColor 的行数（渐变表）
uniform int uMode;          // 0 = 单层, 1 = 累积, 2 = 全部
uniform float uZCur;
uniform float uZBot;
uniform int uHiddenMask;    // 按类型隐藏的位掩码

  float hwPx = clamp(hw * (uProj / max(abs(pc.w), 1e-4)), minHalf, uMaxHalfPx);

in vec3 vNrm;
in vec3 vWpos;
in float vZbot;
in float vZtop;

uniform vec3 uCam;
uniform vec3 uBg;
uniform float uLayerH;

const float L_TOP_SPECULAR = 0.6 * 0.25;
const float L_TOP_SHININESS = 20.0;
const float L_FRONT_DIFFUSE = 0.6 * 0.2;

}`;
